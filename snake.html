
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #101827, #172b36);
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border: 1px solid #334155;
      border-radius: 20px;
      background: #1e293b;
      box-shadow: 0 20px 50px #0005;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      color: #4ade80;
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .score-card {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      background: #0f172a;
    }

    .score-card p {
      margin-bottom: 6px;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
    }

    .score-card span {
      color: #4ade80;
      font-size: 24px;
      font-weight: bold;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 2px solid #334155;
      border-radius: 12px;
      background: #0b1220;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #020617c9;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      margin-bottom: 10px;
      color: #4ade80;
      font-size: 28px;
    }

    .overlay p {
      margin-bottom: 18px;
      color: #cbd5e1;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #4ade80;
      color: #052e16;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      touch-action: manipulation;
    }

    button:hover {
      background: #86efac;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.96);
    }

    .start-btn {
      padding: 12px 26px;
    }

    .controls-info {
      margin-top: 16px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.7;
    }

    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 48px);
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
    }

    .mobile-controls button {
      background: #334155;
      color: white;
      font-size: 22px;
    }

    .mobile-controls button:hover {
      background: #475569;
    }

    .up {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .bottom-actions {
      margin-top: 18px;
    }

    .restart-btn {
      width: 100%;
      padding: 13px;
      background: #334155;
      color: #ffffff;
    }

    .restart-btn:hover {
      background: #475569;
    }

    @media (max-width: 400px) {
      .game-container {
        padding: 15px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .mobile-controls {
        grid-template-columns: repeat(3, 52px);
      }
    }
  </style>
</head>

<body>
  <main class="game-container">
    <h1>🐍 SNAKE</h1>
    <p class="subtitle">Eat, grow, and beat your high score!</p>

    <section class="score-board">
      <div class="score-card">
        <p>Score</p>
        <span id="score">0</span>
      </div>

      <div class="score-card">
        <p>Best Score</p>
        <span id="bestScore">0</span>
      </div>
    </section>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Ready?</h2>
        <p id="overlayMessage">Press start to begin playing.</p>
        <button class="start-btn" id="startBtn">Start Game</button>
      </div>
    </div>

    <p class="controls-info">
      Desktop: Use arrow keys or WASD<br />
      Mobile: Use the directional buttons below
    </p>

    <div class="mobile-controls">
      <button class="up" data-direction="up" aria-label="Move up">▲</button>
      <button class="left" data-direction="left" aria-label="Move left">◀</button>
      <button class="down" data-direction="down" aria-label="Move down">▼</button>
      <button class="right" data-direction="right" aria-label="Move right">▶</button>
    </div>

    <div class="bottom-actions">
      <button class="restart-btn" id="restartBtn">↻ Restart Game</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const bestScoreElement = document.getElementById("bestScore");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayMessage = document.getElementById("overlayMessage");
    const startBtn = document.getElementById("startBtn");

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score = 0;
    let bestScore = 0;
    let gameRunning = false;
    let gameOver = false;
    let gameTimer = null;

    try {
      bestScore = Number(localStorage.getItem("snakeBestScore")) || 0;
    } catch (error) {
      bestScore = 0;
    }

    bestScoreElement.textContent = bestScore;

    function resetGame() {
      clearInterval(gameTimer);

      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameRunning = false;
      gameOver = false;

      scoreElement.textContent = score;
      food = createFood();

      drawGame();

      overlayTitle.textContent = "Ready?";
      overlayMessage.textContent = "Press start to begin playing.";
      startBtn.textContent = "Start Game";
      overlay.classList.remove("hidden");
    }

    function createFood() {
      let position;

      do {
        position = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
      } while (
        snake && snake.some(
          segment =>
            segment.x === position.x &&
            segment.y === position.y
        )
      );

      return position;
    }

    function startGame() {
      if (gameRunning) return;

      if (gameOver) {
        resetGame();
      }

      gameRunning = true;
      gameOver = false;
      overlay.classList.add("hidden");

      clearInterval(gameTimer);
      gameTimer = setInterval(
        updateGame,
        Math.max(65, 150 - Math.floor(score / 50) * 10)
      );
    }

    function updateGame() {
      if (!gameRunning) return;

      direction = { ...nextDirection };

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const eating = head.x === food.x && head.y === food.y;

      // When not eating, the tail moves away this turn.
      const bodyToCheck = eating ? snake : snake.slice(0, -1);

      const hitWall =
        head.x < 0 ||
        head.x >= TILE_COUNT ||
        head.y < 0 ||
        head.y >= TILE_COUNT;

      const hitSelf = bodyToCheck.some(
        segment => segment.x === head.x && segment.y === head.y
      );

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score += 10;
        scoreElement.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          bestScoreElement.textContent = bestScore;

          try {
            localStorage.setItem("snakeBestScore", bestScore);
          } catch (error) {
            // The game still works if storage is unavailable.
          }
        }

        food = createFood();

        // Increase speed gradually as the score increases.
        clearInterval(gameTimer);
        gameTimer = setInterval(
          updateGame,
          Math.max(65, 150 - Math.floor(score / 50) * 10)
        );
      } else {
        snake.pop();
      }

      drawGame();
    }

    function endGame() {
      gameRunning = false;
      gameOver = true;
      clearInterval(gameTimer);

      overlayTitle.textContent = "Game Over!";
      overlayMessage.textContent = `Your final score: ${score}`;
      startBtn.textContent = "Play Again";
      overlay.classList.remove("hidden");
    }

    function drawGame() {
      // Background
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = "#162235";
      ctx.lineWidth = 1;

      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Food
      const foodCenterX = food.x * GRID_SIZE + GRID_SIZE / 2;
      const foodCenterY = food.y * GRID_SIZE + GRID_SIZE / 2;

      ctx.fillStyle = "#fb4f64";
      ctx.beginPath();
      ctx.arc(
        foodCenterX,
        foodCenterY,
        GRID_SIZE * 0.38,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "#fda4af";
      ctx.beginPath();
      ctx.arc(
        foodCenterX - 3,
        foodCenterY - 3,
        3,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Snake
      snake.forEach((segment, index) => {
        const padding = 1.5;
        const x = segment.x * GRID_SIZE + padding;
        const y = segment.y * GRID_SIZE + padding;
        const size = GRID_SIZE - padding * 2;

        ctx.fillStyle = index === 0 ? "#86efac" : "#22c55e";
        roundedRect(ctx, x, y, size, size, 5);
      });

      // Eyes
      drawEyes();
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function drawEyes() {
      const head = snake[0];
      const centerX = head.x * GRID_SIZE + GRID_SIZE / 2;
      const centerY = head.y * GRID_SIZE + GRID_SIZE / 2;

      let eyes = [];

      if (direction.x === 1) {
        eyes = [
          [centerX + 4, centerY - 5],
          [centerX + 4, centerY + 5]
        ];
      } else if (direction.x === -1) {
        eyes = [
          [centerX - 4, centerY - 5],
          [centerX - 4, centerY + 5]
        ];
      } else if (direction.y === -1) {
        eyes = [
          [centerX - 5, centerY - 4],
          [centerX + 5, centerY - 4]
        ];
      } else {
        eyes = [
          [centerX - 5, centerY + 4],
          [centerX + 5, centerY + 4]
        ];
      }

      ctx.fillStyle = "#064e3b";

      eyes.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function changeDirection(newDirection) {
      if (!gameRunning) return;

      // Prevent the snake from reversing into itself.
      if (
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y
      ) {
        return;
      }

      nextDirection = newDirection;
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      const keyDirections = {
        arrowup: { x: 0, y: -1 },
        w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 },
        s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 },
        a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 },
        d: { x: 1, y: 0 }
      };

      if (keyDirections[key]) {
        event.preventDefault();
        changeDirection(keyDirections[key]);
      }

      if (key === " " && !gameRunning) {
        event.preventDefault();
        startGame();
      }
    });

    document.querySelectorAll("[data-direction]").forEach(button => {
      button.addEventListener("click", () => {
        const directions = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };

        changeDirection(directions[button.dataset.direction]);
      });
    });

    startBtn.addEventListener("click", startGame);
    document.getElementById("restartBtn").addEventListener(
      "click",
      resetGame
    );

    // Initial screen
    resetGame();
  </script>
</body>
</html>
